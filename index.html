<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Games Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🎮</span>
        <h1>Games Tracker</h1>
      </div>
      <button class="btn btn-primary" id="btn-add">+ Add Game</button>
    </div>
  </header>

  <main class="main-content">
    <div class="stats-bar" id="stats-bar">
      <div class="stat-pill">Loading...</div>
    </div>

    <div class="games-grid" id="games-grid">
      <div class="loading-state">
        <span>🎮</span>
        <p>Loading your games...</p>
      </div>
    </div>
  </main>

  <!-- Modal overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Game</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <form id="games-form" autocomplete="off">
        <input type="hidden" id="games-id" />

        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" placeholder="e.g. Elden Ring" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="genre">Genre</label>
            <input type="text" id="genre" placeholder="e.g. RPG" />
          </div>
          <div class="form-group">
            <label for="platform">Platform</label>
            <input type="text" id="platform" placeholder="e.g. PC, PS5" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="plan_to_play">Plan to Play</option>
              <option value="playing">Playing</option>
              <option value="completed">Completed</option>
              <option value="on_hold">On Hold</option>
              <option value="dropped">Dropped</option>
            </select>
          </div>
          <div class="form-group">
            <label for="hours_played">Hours Played</label>
            <input type="number" id="hours_played" min="0" placeholder="0" />
          </div>
        </div>

        <div class="form-group">
          <label for="image_url">Cover Image URL</label>
          <input type="url" id="image_url" placeholder="https://..." />
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="3" placeholder="What do you think so far?"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit">Save Game</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Delete confirm dialog -->
  <div class="modal-overlay" id="confirm-overlay">
    <div class="modal modal-sm">
      <div class="confirm-icon">🗑️</div>
      <h3 id="confirm-title">Delete game?</h3>
      <p id="confirm-text">This action cannot be undone.</p>
      <div class="form-actions">
        <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
